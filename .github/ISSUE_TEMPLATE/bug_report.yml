name: Relatar problema
description: Descreva uma falha reproduzível.
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Versão, sistema e controle
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir
      description: Inclua lutadores, mapa, modo e comandos.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Resultado esperado e observado
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidência sem dados pessoais ou credenciais
